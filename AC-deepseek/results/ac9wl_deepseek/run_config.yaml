# Miner Configuration
miner:
  count: 3
  ids: ["miner_1", "miner_2", "miner_3"]
  max_iterations: 15
  model:
    code: "deepseek-v4-flash"  # sub2api Responses ingress -> paid DeepSeek Chat upstream
    config_path: "../config/models.json"

# Screener Configuration
screener:
  max_iterations: 15
  model:
    code: "deepseek-v4-flash"  # sub2api Responses ingress -> paid DeepSeek Chat upstream
    config_path: "../config/models.json"

# Trader Configuration
trader:
  max_iterations: 15
  model:
    code: "deepseek-v4-flash"  # sub2api Responses ingress -> paid DeepSeek Chat upstream
    config_path: "../config/models.json"

# Workflow Configuration
workflow:
  max_cycles: 300

# 直接运行 AC 时的 benchmark 因子门槛；scheduler 会用 ASSETS.yaml 的同名
# 合约通过环境变量覆盖，确保 AC/FM 使用同一对 IC/ICIR 标准。
factor_validation:
  ic_threshold: 0.007
  icir_threshold: 0.084

# Logging
logging:
  workflow_log: "../logs/workflow.json"
  miner_log_pattern: "../logs/miner_agent_{miner_id}.json"
  screener_log: "../logs/screener_agent.json"
  trader_log: "../logs/trader_agent.json"

# Additional Info
additional_info: |
  Benchmark universe reminder: `watch_list` contains exactly 15 intentionally tradable cross-asset instruments (equity indices, commodities, crypto assets, and yield series), not CSI300 constituent stocks. Use all available instruments; never require a 50/80/300-name cross-section. DXY, USDCNY, USDJPY, EURUSD, and VIX under `index_data` are observation-only signals. The online portfolio is long-only across exactly these 15 assets, uses fractional quantities, has no cash sleeve, and target weights must sum to 1.0. The first allocation is free; each later rebalance charges 3 bps on migrated notional.

  Operational directive (operator, 2026-08-11): your online account contract is verified OK (portfolio_contract_version=ac-worldline-v2-migration-gate); the execution helper and step tool are present and correct. Do NOT spend iterations auditing simulator/repo source files (rebalance_to_weights.py, step, backtest, main.py, etc.). Mandatory cycle flow: (1) read factor_ensemble.json; if it has selected_factors, ensure strategy.py matches, run backtest once, then call the step tool EXACTLY ONCE to advance one 10-trading-day block; (2) if no ensemble exists this cycle, output a short skip message as your final answer WITHOUT tool calls. Repeated source-auditing instead of executing is a known failure mode and will stall/pause the worldline. Execute now.
