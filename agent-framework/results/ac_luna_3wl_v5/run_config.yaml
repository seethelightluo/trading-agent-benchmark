# Miner Configuration
miner:
  count: 3
  ids: ["miner_1", "miner_2", "miner_3"]
  max_iterations: 15
  model:
    code: "gpt-5.6-terra"  # 由 switch_llm.sh 管理
    config_path: "../config/models.json"

# Screener Configuration
screener:
  max_iterations: 15
  model:
    code: "gpt-5.6-terra"  # 由 switch_llm.sh 管理
    config_path: "../config/models.json"

# Trader Configuration
trader:
  max_iterations: 15
  model:
    code: "gpt-5.6-terra"  # 由 switch_llm.sh 管理
    config_path: "../config/models.json"

# Workflow Configuration
workflow:
  max_cycles: 360

# 直接运行 AC 时的 benchmark 因子门槛；scheduler 会用 ASSETS.yaml 的同名
# 合约通过环境变量覆盖，确保 AC/FM 使用同一对 IC/ICIR 标准。
factor_validation:
  ic_threshold: 0.007
  icir_threshold: 0.084

# Logging
logging:
  workflow_log: "../logs/workflow.json"
  miner_log_pattern: "../logs/miner_agent_{miner_id}.json"
  screener_log: "../logs/screener_agent.json"
  trader_log: "../logs/trader_agent.json"

# Additional Info
additional_info: |
  Benchmark universe reminder: `watch_list` contains exactly 15 intentionally tradable cross-asset instruments (equity indices, commodities, crypto assets, and yield series), not CSI300 constituent stocks. Use all available instruments; never require a 50/80/300-name cross-section. DXY, USDCNY, USDJPY, EURUSD, and VIX under `index_data` are observation-only signals. The online portfolio is long-only across exactly these 15 assets, uses fractional quantities, has no cash sleeve, and target weights must sum to 1.0. The first allocation is free; each later rebalance charges 3 bps on migrated notional.

  Operational directive (operator, 2026-08-12 ALIGNED): this directive applies ONLY to the TRADER agent. TRADER: your online account contract is verified OK (portfolio_contract_version=ac-worldline-v2-migration-gate); do NOT spend iterations auditing simulator source (rebalance_to_weights.py, step, backtest, main.py); read factor_ensemble.json; if it has selected_factors, ensure strategy.py matches (same factor_ids, same weights, same directions, and a deterministic forecast_returns dict passed to rebalance_to_weights so the migration-cost gate can decide), run backtest once for validation, then call the step tool EXACTLY ONCE per 10-trading-day block; if no ensemble exists, output a short skip message without tool calls. Every rebalance call MUST pass forecast_returns (15 assets, 10-day horizon) and factor_ids; never call rebalance_to_weights without them. MINER and SCREENER agents must NEVER run backtest/step on the live account, never write or execute cycle/step runner scripts (scripts that import BacktestTool/StepTool or call rebalance_to_weights directly), and never modify persistent/date.json or persistent/account.json. Only the TRADER may advance the live account via the step tool.
