# FM live 配置 — OpenAI 兼容端点（与 AC 共用 OPENAI_API_URL / OPENAI_API_KEY）。
# 与 default.yaml 合并；base_url 由 OpenAIProvider 读 OPENAI_API_URL env。
# execution.cost_bps=3.0、摩擦等沿用 default.yaml。

llm:
  provider: "openai"
  # 与 AC config.yaml 使用同一个 OpenAI 兼容模型（由 switch_llm.sh 切换；配套 AlphaCrafter/.env）。
  model: "gpt-5.6-terra"  # 由 switch_llm.sh 管理
  api_key: null   # null → OpenAIProvider 读 OPENAI_API_KEY 环境变量

# 15 资产 benchmark 的 live 默认值。scheduler 会从 ASSETS.yaml 再次注入
# 并写入每个不可变 warm-up/window 配置，避免直接 CLI 与调度器口径分叉。
mining:
  ic_threshold: 0.04
  icir_threshold: 0.10
  correlation_threshold: 0.5
