# Miner Configuration
miner:
  count: 3
  ids: ["miner_1", "miner_2", "miner_3"]
  max_iterations: 25
  model:
    code: "gpt-5.6-terra"  # 由 switch_llm.sh 管理
    config_path: "../config/models.json"

# Screener Configuration
screener:
  max_iterations: 25
  model:
    code: "gpt-5.6-terra"  # 由 switch_llm.sh 管理
    config_path: "../config/models.json"

# Trader Configuration
trader:
  max_iterations: 25
  model:
    code: "gpt-5.6-terra"  # 由 switch_llm.sh 管理
    config_path: "../config/models.json"

# Workflow Configuration
workflow:
  max_cycles: 150

# 直接运行 AC 时的 benchmark 因子门槛；scheduler 会用 ASSETS.yaml 的同名
# 合约通过环境变量覆盖，确保 AC/FM 使用同一对 IC/ICIR 标准。
factor_validation:
  ic_threshold: 0.04
  icir_threshold: 0.10

# Logging
logging:
  workflow_log: "../logs/workflow.json"
  miner_log_pattern: "../logs/miner_agent_{miner_id}.json"
  screener_log: "../logs/screener_agent.json"
  trader_log: "../logs/trader_agent.json"

# Additional Info
additional_info: |
  Benchmark universe reminder: `watch_list` contains exactly 15 intentionally tradable cross-asset instruments (equity indices, commodities, crypto assets, and yield series), not CSI300 constituent stocks. Use all available instruments; never require a 50/80/300-name cross-section. DXY, USDCNY, USDJPY, EURUSD, and VIX under `index_data` are observation-only signals. The execution simulator is long-only with T+1 settlement, 100-unit lots, and 3 bps one-way friction.
